<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ropero — Catálogo</title>
  <meta name="description" content="Dale una segunda vida a tu ropa — coordina directo por WhatsApp" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#faf9f7" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-catalog">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="6" r="1.6"></circle>
              <path d="M12 7.6v1.6"></path>
              <path d="M12 9.2 3.6 16.4a1.5 1.5 0 0 0 1 2.6h14.8a1.5 1.5 0 0 0 1-2.6L12 9.2Z"></path>
              <path d="M6.2 20h11.6"></path>
            </svg>
          </span>
          <h1 id="app-title">Ropero</h1>
        </div>
        <div class="subtitle">Dale una segunda vida a tu ropa · Coordina directo por WhatsApp</div>
      </div>
      <div class="topbar-actions">
        <button id="share-catalog-btn" class="icon-btn" aria-label="Compartir catálogo" title="Compartir catálogo">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line>
            <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
          </svg>
        </button>
      </div>
      <!-- A propósito: acá NO hay ningún link ni ícono hacia admin.html.
           Este catálogo es lo único que ve un cliente; el acceso de admin
           es una URL/atajo aparte que solo tú conoces (ver SETUP.md). -->
    </header>

    <div class="value-props">
      <div class="value-props-item">
        <svg class="vp-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5Z"></path>
        </svg>
        <span>Reserva por<br />WhatsApp</span>
      </div>
      <div class="value-props-item">
        <svg class="vp-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M8 12.4 10.5 15 16 9"></path>
        </svg>
        <span>Prendas revisadas<br />antes de subir</span>
      </div>
      <div class="value-props-item">
        <svg class="vp-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="11" width="14" height="9" rx="2.2"></rect>
          <path d="M8 11V7.5a4 4 0 0 1 8 0V11"></path>
        </svg>
        <span>Se reserva al<br />instante</span>
      </div>
    </div>

    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="search-input" type="search" placeholder="Buscar por nombre, categoría, marca…" autocomplete="off" enterkeyhint="search" />
      <div id="search-suggestions" class="search-suggestions" hidden></div>
    </div>

    <div class="filters" id="filters"></div>

    <main id="grid" class="grid">
      <!-- las tarjetas se insertan por JS -->
    </main>

    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-state-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 6.5a2.5 2.5 0 0 1 5 0"></path>
          <path d="M12 6.5v2"></path>
          <path d="M12 8.5 4.2 13.8a1.7 1.7 0 0 0 1 3.1h13.6a1.7 1.7 0 0 0 1-3.1L12 8.5Z"></path>
          <path d="M6 19.5h12"></path>
        </svg>
      </div>
      <div class="empty-state-title">Todavía no hay prendas publicadas</div>
      <div class="empty-state-sub">Vuelve pronto, se sube ropa nueva seguido.</div>
    </div>
  </div>

  <div id="detail-root"></div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script>
    document.getElementById("app-title").textContent = window.APP_CONFIG
      ? window.APP_CONFIG.APP_NAME
      : "Ropero";
  </script>
  <script type="module" src="js/catalog.js"></script>
</body>
</html>
